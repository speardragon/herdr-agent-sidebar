# Agent Sidebar layout for herdr — paste into ~/.config/herdr/config.toml
# Comment out (or merge into) any existing [ui] / [ui.sidebar.*] tables first:
# TOML rejects a table defined twice. Then run: herdr server reload-config
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
status_indicators = "dots"

[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$agents_group", fg = "#d1d5db", bold = true, dim = false }],
  [{ token = "$agents_logo", fg = "#ffffff", bold = false, dim = false }, { token = "$agents_mark", fg = "#e5c07b", dim = false, rules = [{ contains = "✓", fg = "#22c55e" }, { contains = "?", fg = "#e06c75" }, { contains = "\uE1D0", fg = "#e06c75" }, { contains = "\uE1D1", fg = "#e06c75" }, { contains = "\uE1D2", fg = "#e06c75" }, { contains = "\uE1D3", fg = "#e06c75" }, { contains = "○", fg = "#d1d5db" }, { contains = "◌", fg = "#c678dd" }] }, { token = "$agents_tab_working", fg = "#e5c07b", dim = false }, { token = "$agents_tab_done", fg = "#22c55e", dim = false }, { token = "$agents_tab_blocked", fg = "#e06c75", dim = false }, { token = "$agents_tab_idle", fg = "#d1d5db", dim = false }, { token = "$agents_tab_unknown", fg = "#c678dd", dim = false }],
  [{ token = "$agents_group_end", fg = "#6b7280", bold = false, dim = false }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$agents_group", fg = "#d1d5db", bold = true, dim = false }],
  [{ token = "$agents_logo", fg = "#d97757", bold = false, dim = false }, { token = "$agents_mark", fg = "#e5c07b", dim = false, rules = [{ contains = "✓", fg = "#22c55e" }, { contains = "?", fg = "#e06c75" }, { contains = "\uE1D0", fg = "#e06c75" }, { contains = "\uE1D1", fg = "#e06c75" }, { contains = "\uE1D2", fg = "#e06c75" }, { contains = "\uE1D3", fg = "#e06c75" }, { contains = "○", fg = "#d1d5db" }, { contains = "◌", fg = "#c678dd" }] }, { token = "$agents_tab_working", fg = "#e5c07b", dim = false }, { token = "$agents_tab_done", fg = "#22c55e", dim = false }, { token = "$agents_tab_blocked", fg = "#e06c75", dim = false }, { token = "$agents_tab_idle", fg = "#d1d5db", dim = false }, { token = "$agents_tab_unknown", fg = "#c678dd", dim = false }],
  [{ token = "$agents_group_end", fg = "#6b7280", bold = false, dim = false }],
